<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="style.css" rel="stylesheet">
</head>

<body>

    <div class="container">
        <div class="todo_app">


            <div class="project_name_and_toggle_image">
                <h1>To-Do List
                    <img src="images/icon.png">
                </h1>


                <button class="dark_mode_image"><img src="images/moon.jpg"></button>
            </div>




            <div class="progress_section">

                <div class="text_and_progresss_line">
                    <h2>keep it up,bro!!</h2>
                    <div class="progress">
                        <p class="progress_line"></p>
                    </div>
                </div>

                <div class="pregress_count_and_circle">
                    <p>0/0</p>
                </div>
            </div>





            <div class="input_section">
                <input type="text" placeholder="add your text" class="user_task_input">
                <input type="date" class="user_date_input">

                <select class="user_priority_option">
                    <option value="" disabled selected>Priority</option>
                    <option value="Low">Low</option>
                    <option value="Mid">Mid</option>
                    <option value="High">High</option>
                </select>



                <button class="add_button">+</button>

            </div>


            <div class="sort_section">
                <select class="sort_priority">
                    <option value="" disabled selected>Priority Sorting</option>
                    <option value="hight_to_low">High -> Low</option>
                    <option value="low_to_high">Low -> High</option>

                </select>



                <select class="sort_by_date">
                    <option value="" selected disabled>Sort By Date</option>
                    <option value="earliest_to_latest">Earliest → Latest</option>
                    <option value="latest_to_earliest">Latest → Earliest</option>

                </select>

                <input class="search_task" placeholder="Search task...">
            </div>



            <div class="headline">
                <p class="task">Task</p>
                <p class="last_date">Last Date</p>
                <p class="priority">Priority</p>
                <button class="delete_image"><img src="images/delete.png"></button>
            </div>


            <div class="row">
                <ul class="list_container">

                    <!--   <li>class=" checked"
                        <span class="task">JS learning</span>
                        <span class="date">16 sept 2026</span>
                        <span class="priorityValue">Low/Mid/High</span>
                        <span class="delete">x</span>
                    </li>

                -->
                </ul>
            </div>


            <p class="no_task">No tasks to show</p>

            <button class="delete_all">Delete All</button>











        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
